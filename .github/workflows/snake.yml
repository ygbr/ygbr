# Generates the contribution snake animation and publishes it to the `output` branch.
# The profile README pulls the SVGs from raw.githubusercontent.com/ygbr/ygbr/output/...
name: Generate contribution snake

on:
  schedule:
    # Every day at 03:00 UTC (midnight in Ribeirão Preto)
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Renders the contribution grid as an animated snake SVG (light + dark variants),
      # with the snake tinted Blue Sky (#99B5CB) to match the profile theme.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ygbr
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#99B5CB
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#99B5CB

      # Pushes the rendered SVGs to the `output` branch so the README can embed them.
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
